- name: Cisco Catalyst Center MCP Server
  description: 'First-party open-source Model Context Protocol server for Catalyst Center, published by Cisco under Apache-2.0
    at cisco-en-programmability/catc-mcp-oss. It is self-hosted: the operator builds the Docker image from a release branch
    matching their Catalyst Center version and runs it as a local streamable-HTTP endpoint (http://localhost:7001/v1/mcp)
    or over stdio. Release branch release/2.3.7.11 bundles 516 generated tools, each carrying the backing Catalyst Center
    method, URI and JSON Schema parameters. There is no Cisco-hosted remote MCP endpoint.'
  humanURL: https://github.com/cisco-en-programmability/catc-mcp-oss
  baseURL: http://localhost:7001/v1/mcp
