  description: >-
    Filter Group is a collection of predefined filters. When this Filter Group is associated with an entity,
    those filters are applied on that entity.This APIs under `filterGroups` section are used to create,
    update, delete and get Filter Groups. Currently these Filter Groups can be used in Custom Dashboard
    and Issue Settings. Filter Group Association is the link between a Filter Group and the associated
    Entity. The APIs under `filterGroupAssociations` section are used to create, read and delete Filter
    Group Assications.
