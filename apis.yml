aid: cisco-catalyst-center
name: Cisco Catalyst Center
description: Cisco Catalyst Center, formerly DNA Center, is Cisco's intent-based networking controller for enterprise
  campus and branch networks. It covers network design, device provisioning, software image management, policy,
  and assurance analytics, and exposes an Intent API documented on Cisco DevNet with an always-on reservationless
  sandbox. Cisco publishes a Terraform provider and Ansible collections against it, but no anonymously fetchable
  OpenAPI document.
