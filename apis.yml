aid: cisco-catalyst-center
name: Cisco Catalyst Center
description: Cisco Catalyst Center, formerly DNA Center, is Cisco's intent-based networking controller for enterprise campus,
  branch and wireless networks. It covers network design and hierarchy, device discovery and provisioning, software image
  management, SD-Access fabric, policy, telemetry and Assurance analytics. Catalyst Center exposes a northbound REST Intent
  API under /dna/intent/api/v1 plus an Assurance data API under /dna/data/api/v1, authenticated with an X-Auth-Token bearer
  token obtained from a Basic-auth token endpoint. Cisco publishes 27 OpenAPI 3.0 documents for the Assurance surface in the
  cisco-en-programmability GitHub organization, a first-party open-source MCP server bundling 516 generated Catalyst Center
  API tools, Python and Go SDKs, Ansible collections and a Terraform provider. The controller is customer-deployed, so the
  API base URL is the customer's own appliance host; Cisco runs always-on DevNet sandboxes for anonymous evaluation.
