apis:
- name: Cisco Catalyst Center Assurance & Intent API
  description: 'Northbound REST API for the Catalyst Center controller. The Intent API (/dna/intent/api/v1) covers device
    inventory, sites, discovery, provisioning, software image management, wireless, SD-Access fabric, compliance, reports,
    event subscriptions and issue/health definitions. The Assurance data API (/dna/data/api/v1) serves the analytics surface:
    network devices, clients, interfaces, AAA/DHCP/DNS service experience, site and fabric health summaries, energy, ICAP
    packet capture and ThousandEyes test results. Cisco publishes OpenAPI 3.0 documents for the Assurance surface; 185 operations
    across 27 specifications are captured here.'
  humanURL: https://developer.cisco.com/docs/catalyst-center/
  baseURL: https://{catalyst-center-host}/dna/intent/api/v1
