    ClientFilterObj:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/ClientFilterField'
        operator:
          $ref: '#/components/schemas/Operator'
        logicalOperator:
          $ref: '#/components/schemas/LogicalOperator'
        value:
          type: object
          description: "Field value(s) to filter the data set. Array of values is used for   \"in\" or \"out\" operator. Values\
            \ will be of whatever type the   specific field being filtered is defined with.\n\nFor other operators, filter\
            \ value is of whatever type the specific   field being filtered is defined with.\n\nIn the case of an \"and\"\
            \ or \"or\" operator, this values array will be   ignored, and the values arrays in each of the *nested filters*\
            \ will be used.\nThe data type of a value, or each item inside the value in case it is a list, must match the\
            \ type defined in the Client response model \n"
        filters:
          type: array
          description: 'Nested array of filters in case of AND/OR based filters. Only one   level of nesting will be supported.


            Structure of nested filter is the same as parent with all operators   supported except AND or OR.

            '
          items:
            $ref: '#/components/schemas/ClientFilterObj'
    ClientFilters:
      maxItems: 10
      type: array
      description: 'List of filters to apply when querying the data



        Filtering on numerical fields (integer, number,etc.) will support the

        numerical operators:



        [eq, lt, gt, lte, gte]



        Filtering on text fields (string), will support the string operators:



        [eq, in, notIn, like]



        For the list of supported fields, please refer to the ClientFilterField model

        model.

        '
      example:
      - key: rssi
        operator: gt
        value: -50
      - key: osType
        operator: in
        value:
        - iOS
        - Android
      - logicalOperator: or
        filters:
        - key: vlanId
          operator: eq
          value: '187'
        - key: siteHierarchy
          operator: in
          value:
          - Global/San Jose
          - Global/SFO
      items:
        $ref: '#/components/schemas/ClientFilterObj'
    PaginationWithAggregate:
      type: object
      properties:
        limit:
          maximum: 500
          minimum: 1
          type: integer
          description: Number of records to fetch in a page
          example: 100
          default: 100
        offset:
          minimum: 1
          type: integer
          description: Starting offset of data to fetch and returned
          example: 5
          default: 1
        cursor:
          type: string
          description: It's an opaque string field that indicates the next record in the requested collection. If no records
            remain, the API returns a response with a count of zero. The default value is an empty string, and the initial
            value must be an empty string. The cursor value is populated by the API in the response page block. If the user
            wants more records, the cursor in the subsequent request must be updated with the value from the previous response.
          example: '{apMac_terms=AA:BB:CC:DD:EE:FF, frequency_terms=5.0}'
        count:
          type: integer
          description: Total number of records related to the resource after applying applicable filtering. Field is ignored
            for request and updated by API in the response
          example: 100
        sortBy:
          type: array
          example:
          - name: overallScore
            order: asc
          - name: rssi
            function: min
            order: asc
          - name: usage
            function: sum
            order: desc
          items:
            $ref: '#/components/schemas/SortByObj'
