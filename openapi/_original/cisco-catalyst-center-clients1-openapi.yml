    '400':
      description: The client made a request that the server could not understand (for example, the request syntax is incorrect).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '500':
      description: The server could not fulfill the request due to internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    1XX:
      description: Informational Responses - The server received the request and sent an informational response.
    2XX:
      description: Successful Responses - The server received the client request, understood it, and accepted it.
    3XX:
      description: Redirection Messages - The client must take additional action to complete the request.
    4XX:
      description: Client Error Responses - The client request caused the error.
    5XX:
      description: Server Error Responses - The server failed to fulfill the request.
    defaultError:
      description: Unexpected Error
    '404':
      description: The client made a request for a resource that does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CountIntegerResponse:
      description: Reponse object containing total count of the records after applying requested filters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CountIntegerResponse'
  parameters:
    clientDeviceType:
      name: type
      in: query
      description: 'The client device type whether client is connected to network through Wired or Wireless medium.

        '
      required: false
      schema:
        type: string
        enum:
        - Wired
        - Wireless
      example: Wireless
    clientView:
      name: view
      in: query
      description: 'Client related Views

        Refer to ClientView schema for list of views supported

        Examples:


        `view=Wireless` (single view requested)


        `view=WirelessHealth&view=WirelessTraffic` (multiple view requested)

        '
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    clientAttribute:
      name: attribute
      in: query
      description: 'List of attributes related to resource that can be requested to only be part of the response along with
        the required attributes. Refer to ClientAttribute schema for list of attributes supported Examples:

        `attribute=band` (single attribute requested)

        `attribute=band&attribute=ssid&attribute=overallScore` (multiple attribute requested)'
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    siteHierarchy:
      name: siteHierarchy
      in: query
      description: 'The full hierarchical breakdown of the site tree starting from Global site name and ending with the specific
        site name. The Root site is named "Global" (Ex. "Global/AreaName/BuildingName/FloorName") This field supports partial
        search. All the records containing the filter value will be returned

        Examples:

        `siteHierarchy=Global/AreaName/BuildingName/FloorName` (single siteHierarchy requested)

        `siteHierarchy=Global/AreaName/BuildingName1/FloorName1&siteHierarchy=Global/AreaName/BuildingName1/FloorName2` (multiple
        siteHierarchy requested)'
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    siteHierarchyId:
      name: siteHierarchyId
      in: query
      description: 'The full hierarchy breakdown of the site tree in id form starting from Global site UUID and ending with
        the specific site UUID. (Ex. "/globalUuid/areaUuid/buildingUuid/floorUuid/") This field supports partial search. All
        the records containing the filter value will be returned

        Examples:

        `siteHierarchyId=/globalUuid/areaUuid/buildingUuid/floorUuid/` (single siteHierarchyId requested)

        `siteHierarchyId=/globalUuid/areaUuid/buildingUuid1/floorUuid1/&siteHierarchyId=/globalUuid/areaUuid/buildingUuid1/floorUuid2/`
        (multiple siteHierarchyId requested)'
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    siteId:
      name: siteId
      in: query
      description: 'The site UUID without the top level hierarchy. (Ex."floorUuid") Examples:

        `siteId=floorUuid` (single siteId requested)

        `siteId=floorUuid1&siteId=floorUuid2` (multiple siteId requested)'
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    osType:
      name: osType
      in: query
      description: "Client device operating system type.\nThis field supports wildcard (`*`) character-based search. If the\
        \ value contains the (`*`) character, please use the /query API for regex search. \nEx: `*iOS*` or `iOS*` or `*iOS`\n\
        Examples:\n\n`osType=iOS` (single osType requested)\n\n`osType=iOS&osType=Android` (multiple osType requested)\n"
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    osVersion:
      name: osVersion
      in: query
      description: "Client device operating system version\nThis field supports wildcard (`*`) character-based search. If\
        \ the value contains the (`*`) character, please use the /query API for regex search. \nEx: `*14.3*` or `14.3*` or\
        \ `*14.3`\nExamples:\n\n`osVersion=14.3` (single osVersion requested)\n\n`osVersion=14.3&osVersion=10.1` (multiple\
        \ osVersion requested)\n"
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    band:
      name: band
      in: query
      description: 'WiFi frequency band that client or Access Point operates. Band value is represented in Giga Hertz - GHz

        Examples:


        `band=5GHZ` (single band requested)


        `band=2.4GHZ&band=6GHZ` (multiple band requested)

        '
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
          - 2.4GHZ
          - 5GHZ
          - 6GHZ
    ssid:
      name: ssid
      in: query
      description: "SSID is the name of wireless network to which client connects to. It is also referred to as WLAN ID -\
        \ Wireless Local Area Network Identifier.\nThis field supports wildcard (`*`) character-based search. If the value\
        \ contains the (`*`) character, please use the /query API for regex search. \nEx: `*Alpha*` or `Alpha*` or `*Alpha`\n\
        \nExamples:\n\n`ssid=Alpha` (single ssid requested)\n\n`ssid=Alpha&ssid=Guest` (multiple ssid requested)\n"
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    macAddress:
      name: macAddress
      in: query
      description: "The macAddress of the network device or client\nThis field supports wildcard (`*`) character-based search.\
        \ \nEx: `*AB:AB:AB*` or `AB:AB:AB*` or `*AB:AB:AB`\nExamples:\n\n`macAddress=AB:AB:AB:CD:CD:CD` (single macAddress\
        \ requested)\n\n`macAddress=AB:AB:AB:CD:CD:DC&macAddress=AB:AB:AB:CD:CD:FE` (multiple macAddress requested)\n"
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    ipv4Address:
      name: ipv4Address
      in: query
      description: "IPv4 Address of the network entity either network device or client\nThis field supports wildcard (`*`)\
        \ character-based search. \nEx: `*1.1*` or `1.1*` or `*1.1`\n\nExamples:\n\n`ipv4Address=1.1.1.1` (single ipv4Address\
        \ requested)\n\n`ipv4Address=1.1.1.1&ipv4Address=2.2.2.2` (multiple ipv4Address requested)\n"
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: ipv4
    ipv6Address:
      name: ipv6Address
      in: query
      description: 'IPv6 Address of the network entity either network device or client

        This field supports wildcard (`*`) character-based search.

        Ex: `*2001:db8*` or `2001:db8*` or `*2001:db8`


        Examples:


        `ipv6Address=2001:db8:0:0:0:0:2:1` (single ipv6Address requested)


        `ipv6Address=2001:db8:0:0:0:0:2:1&ipv6Address=2001:db8:85a3:8d3:1319:8a2e:370:7348` (multiple ipv6Address requested)

        '
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: ipv6
    wlcName:
      name: wlcName
      in: query
      description: 'Wireless Controller name that reports the wireless client.

        This field supports wildcard (`*`) character-based search. If the value contains the (`*`) character, please use the
        /query API for regex search.

        Ex: `*wlc-25*` or `wlc-25*` or `*wlc-25`


        Examples:


        `wlcName=wlc-25` (single wlcName requested)


        `wlcName=wlc-25&wlc-34` (multiple wlcName requested)

        '
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    connectedNetworkDeviceName:
      name: connectedNetworkDeviceName
      in: query
      description: "Name of the neighbor network device that client is connected to.\nThis field supports wildcard (`*`) character-based\
        \ search. If the value contains the (`*`) character, please use the /query API for regex search.\nEx: `*ap-25*` or\
        \ `ap-25*` or `*ap-25`\n\nExamples:\n\n`connectedNetworkDeviceName=ap-25` (single connectedNetworkDeviceName requested)\n\
        \n`connectedNetworkDeviceName=ap-25&ap-34` (multiple connectedNetworkDeviceName requested)    \n"
      required: false
