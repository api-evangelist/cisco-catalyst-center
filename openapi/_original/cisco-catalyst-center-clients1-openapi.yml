      - clients
      summary: Retrieves the list of clients by applying complex filters while also supporting aggregate attributes.
      description: "Retrieves the list of clients by applying complex filters while also supporting aggregate attributes.\
        \ If startTime and endTime are not provided, the API defaults to the last 24 hours.\n\n**The input payload contains\
        \ the following fields,**\n|Field Name | Description |\n| --- | --- |\n| `startTime` | The start time indicates when\
        \ the API begins retrieving data related to the resource. It must be specified in the UNIX epoch time format, measured\
        \ in milliseconds. This value is inclusive, and if left unspecified, the default is 1 day before the endTime. |\n\
        | `endTime` | The end time indicates the upper limit until which the API retrieves data related to the resource. It\
        \ must be defined in the UNIX epoch time format, measured in milliseconds. This value is inclusive, and if left unspecified,\
        \ the default is the latest available data. |\n| `views` |  A collection of attributes classified as \"view\" associated\
        \ with the resource, which can be requested to be included in the response alongside the required attributes. Each\
        \ view comprises a predetermined set of attributes. Refer to `ClientView` for the supported views |\n| `attributes`\
        \ | A list of attributes associated with the resource, which can be requested to be included in the response alongside\
        \ the required attributes. Refer to `ClientAttribute` model for the supported attributes |\n| `aggregateAttributes`\
        \ | This specifies the attribute name and the function to be applied during data querying. The aggregate function\
        \ is then applied to data within the specified start and end times. Refer to `ClientAggregateField` model for the\
        \ supported aggregate attributes |\n|`filters`| This is used to specify one or more conditions for filtering the queried\
        \ data. Refer to `ClientFilterField` model for the supported filters |\n|`page`| It includes the **limit, offset,\
        \ and sortBy** fields. *limit* denotes the number of records to retrieve per page, *offset* signifies the initial\
        \ data position, and *sortBy* is used to sort the response based on the sortBy fields. It contains the attribute name,\
        \ order, and optional function for sorting by the aggregated field. Refer to `ClientSortByField` model for the supported\
        \ sortBy names.|\n**How the filtering behavior works**\nThe `filters` field in each post body can be used in various\
        \ ways:\nEach filter in the list of filters will be applied simultaneously. For instance, the following example would\
        \ request filtering to retrieve clients with an RSSI value greater than -50 dBm and a osType of either iOS or Android.\n\
        ``` \"filters\": [\n    {\n      \"key\": \"rssi\",\n      \"operator\": \"gt\",\n      \"value\": -50\n    },\n \
        \   {\n      \"key\": \"osType\",\n      \"operator\": \"in\",\n      \"value\": [\n        \"iOS\",\n        \"Android\"\
        \n      ]\n    }\n]\n```\n\nEach filter object can utilize its logical operator differently to offer nested filtering\
        \ functionality.\nIn the example below, you can observe a logical `OR` filter being applied using the nested filtering\
        \ functionality:\nThe main filter object doesn't have its `key`, `value`, or `operator` fields populated. Only the\
        \ `logicalOperator` field is populated to indicate that the filters within the nested filters list are to be logically\
        \ combined.\n``` \"filters\": [\n    {\n      \"logicalOperator\": \"or\",\n      \"filters\": [\n        {\n    \
        \      \"key\": \"vlanId\",\n          \"operator\": \"eq\",\n          \"value\": \"187\"\n        },\n        {\n\
        \          \"key\": \"siteHierarchy\",\n          \"operator\": \"in\",\n          \"value\": [\"Global/San Jose\"\
        , \"Global/SFO\"]\n        }\n      ]\n    }\n] ```"
      operationId: queryClients
      parameters:
      - name: X-CALLER-ID
        in: header
        description: 'Caller ID is used to trace the origin of API calls and their associated queries executed on the database.
          It''s an optional header parameter that can be added to an API request.

          '
        required: false
        schema:
          type: string
          default: unknown
        example: ui:client360
