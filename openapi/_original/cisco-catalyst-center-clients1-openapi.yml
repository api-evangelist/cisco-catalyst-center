    WirelessLatencyStats:
      type: object
      properties:
        video:
          type: integer
          description: Video traffic WiFi latency measured in milliseconds (ms)
          example: 7
        voice:
          type: integer
          description: Voice traffic WiFi latency measured in milliseconds (ms)
          example: 7
        bestEffort:
          type: integer
          description: Best Effort traffic WiFi latency measured in milliseconds (ms)
          example: 7
        background:
          type: integer
          description: Background traffic WiFi latency measured in milliseconds (ms)
          example: 7
      description: Wireless latency is measured by the time it takes for a packet to be successfully transmitted from an AP
        to the client
    Band:
      type: string
      description: WiFi frequency band that client or Access Point operates. Band value is represented in Giga Hertz - GHz
      example: BAND_5_GHZ
      enum:
      - BAND_2_4_GHZ
      - BAND_5_GHZ
      - BAND_6_GHZ
    Ssid:
      type: string
      description: SSID is the name of wireless network to which clientconnects to. It is also referred to as   WLAN ID -
        Wireless Local Area Network Identifier
      example: alpha
    L2Vn:
      type: string
      description: L2 Virtual network name assigned to wired client
      example: INFRA-VN
    L3Vn:
      type: string
      description: L3 Virtual network name assigned to wired client
      example: DATA-VN
    ApMac:
      type: string
      description: Access Point's base radio mac addresss where the wireless client is connected
      format: mac
      example: AA:11:22:33:44:00
    RadioId:
      type: integer
      description: Radio slot Id of the Access Point where the wireless client is connected
      example: 2
    ApEthernetMac:
      type: string
      description: Ethernet Mac Address of the Access Point the wireless client is connected to
      example: AA:BB:CC:DD:FF:00
    ApMode:
      type: string
      description: Access Point operating mode
      example: Local
      enum:
      - Local
      - Monitor
      - FlexConnect
      - Rogue Detector
      - Sniffer
      - Bridge
      - SE-Connect
      - Flex+Bridge
      - Sensor
    WlcName:
      type: string
      description: Wireless Controller name that reports the wireless client
      example: wnbu-sjc24-00a-ewlc-prod2.cisco.com
    WlcId:
      type: string
      description: UUID of the Wireless Controller that reports the wireless client
      example: 9bbc92ad-b0e8-4638-95f6-c9bec7046dc8
    Channel:
      type: string
      description: Specific WiFi frequency that client uses to send or receive data from Access Point
      example: '100'
    ChannelWidth:
      type: string
      description: Is the channel bandwidth used by the radio for WiFi communication.
      example: '40'
    Protocol:
      type: string
      description: 802.11 protocol type used by wireless client to connect to Access Point
      example: 802.11ac
      enum:
      - 802.11b
      - 802.11a
      - 802.11g
      - 802.11n
      - 802.11ac
      - 802.11ax
      - 802.11ax6
      - 802.11be
      - unclassified
    ProtocolCapability:
      type: string
      description: Highest protocol supported by the wireless client
      example: 802.11ax
      enum:
      - legacy
      - 802.11n
      - 802.11ac
      - 802.11ax
      - 802.11ax6
      - 802.11be
      - unclassified
    Ipv4Addresses:
      type: array
      description: 'IPv4 Address of the network entity either network device or client

        This field supports wildcard (`*`) character-based search. If the value contains the (`*`) character, please use the
        /query API for search. E.g. `.*1.1.1*`


        Examples:


        `ipv4Address=1.1.1.1` (single ipv4Address requested)


        `ipv4Address=1.1.1.1,2.2.2.2` (multiple ipv4Address requested)

        '
      items:
        type: string
        format: ipv4
    Ipv6Addresses:
      type: array
      description: 'IPv6 Address of the network entity either network device or client

        This field supports wildcard (`*`) character-based search. If the value contains the (`*`) character, please use the
        /query API for search. E.g. `.*2001:db8*`


        Examples:


        `ipv6Addresses=2001:db8:0:0:0:0:2:1` (single ipv6Address requested)


        `ipv6Addresses=2001:db8:0:0:0:0:2:1, 2001:db8:85a3:8d3:1319:8a2e:370:7348` (multiple ipv6Addresses requested)

        '
      example:
      - 2001:db8:0:0:0:0:2:1
      - 2001:db8:0:0:0:0:2:1, 2001:db8:85a3:8d3:1319:8a2:370:7348
      items:
        type: string
        format: ipv6
    MacAddress:
      pattern: ^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$|^[0-9A-Fa-f]{4}\.[0-9A-Fa-f]{4}\.[0-9A-Fa-f]{4}$
      type: string
      description: Mac Address of the Client
      readOnly: true
      example: AA:BB:CC:DD:EE:FF
    siteHierarchy:
      type: string
      description: The full hierarchy breakdown of the site tree in name form starting from Global site name and ending with
        the specific site site. 'Global' is the Root name of the site hierarchy tree. Site name including the hierarchy where
        the network device or client is located. For clients site is derived based on site assigned to network device where
        the client is connected to. For Wireless client its the connected Access Point site and for Wired client its the connected
        switch site. For network device its the site assigned to it.
      example: Global/AreaName/BuildingName/FloorName
    siteHierarchyId:
      type: string
      description: The full hierarchy breakdown of the site tree in id form starting from Global site UUID and ending with
        the specific site UUID.
      example: /31e57cb2-06af-4c5c-87d1-16af536095d2/54d3f243-509e-436d-98-ebe01daf80db/f52fbe48-fcc9-4551-947b-e144e20c0311/50c01c29-b09e-49-b6ce-2e7d3395f3a3/
    ClientsSummaryRequest:
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/startTime'
        endTime:
          $ref: '#/components/schemas/endTime'
        groupBy:
          $ref: '#/components/schemas/ClientGroupByAttributes'
