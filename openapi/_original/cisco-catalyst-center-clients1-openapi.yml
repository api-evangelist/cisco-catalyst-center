          description: It's an opaque string field that indicates the next record in the requested collection. If no records
            remain, the API returns a response with a count of zero. The default value is an empty string, and the initial
            value must be an empty string. The cursor value is populated by the API in the response page block. If the user
            wants more records, the cursor in the subsequent request must be updated with the value from the previous response.
          example: '{~modificationtime_histo=1.7115912E12}'
          default: ''
        count:
