    ClientViews:
      type: array
      description: "View is predefined set of attributes supported by the API. The attributes related to view only will be\
        \ part of the API response   along with required fields. If multiple views are requested response will contain attributes\
        \ from requested views. If no views are specified all the attributes will be returned\nClient Views are broadly categorized\
        \ into Wired and Wireless.\n`Wired` includes attributes related to a wired client and `Wireless` includes attributes\
        \ related to a wireless client\nThere are specific views for Wired and Wireless category that user   can request the\
        \ data for\n\n| View Name | Included Attributes |\n| --- | --- |\n| `Wired` | id, macAddress, type, name, userId,\
        \ username, ipv4Address, ipv6Addresses, vendor, osType, osVersion, formFactor, deviceType, siteHierarchy, siteHierarchyId,\
        \ siteId,   lastUpdatedTime, connectionStatus, tracked, isPrivateMacAddress, overallScore, onboardingScore, connectedScore,\
        \ linkErrorPercentageThreshold, islinkErrorIncluded,   txBytes, rxBytes, usage, rxPackets, txPackets, rxRate, txRate,\
        \   rxLinkErrorPercentage, txLinkErrorPercentage, connectedNetworkDeviceId, connectedNetworkDeviceName, connectedNetworkDeviceManagementIp,\
        \ connectedNetworkDeviceMac,     interfaceName, interfaceSpeed, duplexMode, connectedNetworkDeviceType, vnId, l2Vn,\
        \ l3Vn, vlanId, securityGroupTag,   linkSpeed, sessionDuration, bridgeVMMode, isFabricClient  |\n| `WiredConnection`\
        \ | id, macAddress, type, vnId, l2Vn, l3Vn, securityGroupTag, linkSpeed, sessionDuration, bridgeVMMode, isFabricClient\
        \ |\n| `WiredTraffic` | id, macAddress, type, txBytes, rxBytes, usage, rxPackets, txPackets, rxRate, txRate, rxLinkErrorPercentage,\
        \ txLinkErrorPercentage |\n| `WiredHealth` | id, macAddress, type, overallScore,   onboardingScore, connectedScore,\
        \ linkErrorPercentageThreshold, islinkErrorIncluded |\n| `WiredConnectedNetworkDevice` | id, macAddress, type, connectedNetworkDeviceId,\
        \ connectedNetworkDeviceName, connectedNetworkDeviceManagementIp,  connectedNetworkDeviceMac,    interfaceName, interfaceSpeed,\
        \ duplexMode, connectedNetworkDeviceType |\n| `Wireless` | id, macAddress, type, name, userId, username,   ipv4Address,\
        \ ipv6Addresses, vendor, osType, osVersion,   formFactor, deviceType, siteHierarchy, siteHierarchyId, siteId,   lastUpdatedTime,\
        \ connectionStatus, tracked, isPrivateMacAddress,   overallScore, onboardingScore,   connectedScore, rssiThreshold,\
        \ snrThreshold,   isRssiIncluded, isSnrIncluded, txBytes, rxBytes, usage, rxPackets, txPackets, rxRate, txRate, rxRetries,\
        \ rxRetryPercentage, txDrops, txDropPercentage, dnsRequestCount, dnsResponseCount, connectedNetworkDeviceId, connectedNetworkDeviceName,\
        \ connectedNetworkDeviceManagementIp, connectedNetworkDeviceMac,  connectedNetworkDeviceType, band,   ssid, vlanId,\
        \ authType,   wlcName, wlcId, apMac,   apEthernetMac, radioId, channel, channelWidth, protocol, protocolCapability,\
        \ upnId, upnName,   upnOwner, upnDuid, rssi,   snr, dataRate, sessionDuration,   isIosAnalyticsCapable, isFabricClient,\
        \ avgRunDuration,   maxRunDuration, avgAssocDuration,   maxAssocDuration, avgRunDuration, maxRunDuration, avgAssocDuration,\
        \   maxAssocDuration, avgAuthDuration, maxAuthDuration, avgDhcpDuration,   maxDhcpDuration, maxRoamingDuration, aaaServerIp,\
        \ dhcpServerIp, authDoneTime, assocDoneTime, dhcpDoneTime, roamingTime, failedRoamingCount, successfulRoamingCount,\
        \ successfulRoamingCount, assocFailureReason, aaaFailureReason,  dhcpFailureReason, otherFailureReason, latestFailureReason,\
        \ video, voice, bestEffort, background   |\n| `WirelessConnection` | id, macAddress, type, band,   ssid, vlanId, authType,\
        \   wlcName, wlcId, apMac,   apEthernetMac, radioId, channel  , channelWidth, protocol, protocolCapability, upnId,\
        \ upnName,   upnOwner, upnDuid, rssi,   snr, dataRate, sessionDuration,   isIosAnalyticsCapable, isFabricClient |\n\
        | `WirelessTraffic` | id, macAddress, type, txBytes, rxBytes, usage, rxPackets, txPackets, rxRate, txRate, rxRetries,\
        \   rxRetryPercentage, txDrops, txDropPercentage, dnsRequestCount, dnsResponseCount |\n| `WirelessHealth` | id, macAddress,\
        \ type, overallScore,   onboardingScore, connectedScore, rssiThreshold, snrThreshold, isRssiIncluded,   isSnrIncluded\
        \ |\n| `WirelessConnectedNetworkDevice` | id, macAddress, type,   connectedNetworkDeviceId, connectedNetworkDeviceName,\
        \ connectedNetworkDeviceManagementIp, connectedNetworkDeviceMac,   connectedNetworkDeviceType |\n| `Detail` | id,\
        \ macAddress, type, name, userId, username,   ipv4Address, ipv6Addresses, vendor, osType, osVersion,   formFactor,\
        \ deviceType, siteHierarchy, siteHierarchyId, siteId,   lastUpdatedTime, connectionStatus, tracked, isPrivateMacAddress,\
        \   overallScore |\n \n| `Onboarding` | id, macAddress, type, avgRunDuration, maxRunDuration, avgAssocDuration,  \
        \ maxAssocDuration, avgAuthDuration, maxAuthDuration, avgDhcpDuration,   maxDhcpDuration, maxRoamingDuration, aaaServerIp,\
        \ dhcpServerIp, authDoneTime, assocDoneTime, dhcpDoneTime, roamingTime, failedRoamingCount, successfulRoamingCount,\
        \ successfulRoamingCount, assocFailureReason, aaaFailureReason, dhcpFailureReason, otherFailureReason, latestFailureReason\
        \ |\n| `Latency` | id, macAddress, type, video, voice, bestEffort, background |\nExamples:\nviews=Wired (single view\
        \ requested)\nviews=Detail,Wireless Connection,Wireless Health (multiple views  requested)"
      example:
      - Wireless
      items:
        $ref: '#/components/schemas/ClientView'
