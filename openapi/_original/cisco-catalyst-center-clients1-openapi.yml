          - $ref: '#/components/schemas/CommonTrafficStats'
          - $ref: '#/components/schemas/WiredTrafficStats'
          - $ref: '#/components/schemas/WirelessTrafficStats'
        connectedNetworkDevice:
          allOf:
          - $ref: '#/components/schemas/CommonConnectedNetworkDeviceDetail'
          - $ref: '#/components/schemas/WiredConnectedNetworkDeviceDetail'
        connection:
          allOf:
          - $ref: '#/components/schemas/CommonConnectionDetail'
          - $ref: '#/components/schemas/WiredConnectionDetail'
          - $ref: '#/components/schemas/WirelessConnectionDetail'
        onboarding:
          $ref: '#/components/schemas/OnboardingDetail'
        latency:
          $ref: '#/components/schemas/WirelessLatencyStats'
      description: Assurance Network Client details
      allOf:
      - $ref: '#/components/schemas/ClientBasic'
      - $ref: '#/components/schemas/CommonDetail'
    ClientBasic:
      type: object
      properties:
        id:
          type: string
          description: Unique ID of the Client. It is the Mac Address of the clien.
          example: AA:BB:CC:DD:EE:FF
        macAddress:
          $ref: '#/components/schemas/MacAddress'
        type:
          type: string
          description: The client device type whether client is connected to network through Wired or Wireless medium.
          example: Wireless
          enum:
          - Wired
          - Wireless
      description: Basic information about the client
    CommonDetail:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/name'
        userId:
          type: string
          description: User id of the client using this device. Multiple clientdevices can be assigned to single   user. This
            field will tell theunique identifer of the user using this device.
          example: jdoe
        username:
          type: string
          description: Name of the user to which the client is assigned
          example: 12-34-56-AB-CD-EF
        ipv4Address:
          $ref: '#/components/schemas/IPv4Address'
        ipv6Addresses:
          type: array
          description: IPv6 addresses of the client
          items:
            $ref: '#/components/schemas/IPv6Address'
        vendor:
          type: string
          description: Vendor name of the client device
          example: Apple
        osType:
          type: string
          description: Device operating system type
          example: iOS
        osVersion:
          type: string
          description: Device operating system version
          example: 17.1.2
        formFactor:
          type: string
          description: Device Form Factor like Phone, Tablet etc
          example: Phone
        trustScore:
          type: number
          description: Trust Score is AI Endpoint Analytics trust level based on various anomaly protection on the device.
          example: 3
        deviceType:
          type: string
          description: Device type like Apple-Device, Intel-Device etc
          example: Apple-Device
        siteHierarchy:
          $ref: '#/components/schemas/siteHierarchy'
        siteHierarchyId:
          $ref: '#/components/schemas/siteHierarchyId'
        siteId:
          type: string
          description: Leaf level site uuid of the network device to which the client is connected to
          example: 4049312a-e65d-4054-a8b7-dd5fd4b08cb8
        lastUpdatedTime:
          type: integer
          description: Last known time when the client was updated. It is specified in UNIX epochtime format in milliseconds
          format: int64
          example: 16994442370000
        connectionStatus:
          type: string
          description: Client connection status. 'Connecting' state is applicable only for Wireless client. Other state are
            applicable for both wired and wireless clients
          example: connected
          enum:
          - connected
          - disconnected
          - connecting
          - unknown
        tracked:
          type: string
          description: Field to indicate if client is tracked or not by the controller based on client tracking rules
          enum:
          - 'Yes'
          - 'No'
        isPrivateMacAddress:
          type: boolean
          description: Is the client is connected to network using unique private network address enabled on the client
          example: false
      description: Client detail information common for wired and wireless
    CommonHealthKpi:
      type: object
      properties:
        overallScore:
          type: integer
          description: 'Overall Health Score of the client.  The Individual Client Health score is the sum of the Client Onboarding
            score and the Client    Connectivity score. The client health score ranges from 1 to 10, with a score of 0 for    inactive
            clients. It is calculated as follows:

            `Wired Client`: Link to first switch is up, authentication and authorization is successful    and IP address is
            received. Client score is 10.

            `Wireless Client`: Client joined the network and has good connection in terms of the RSSI     and SNR KPIs.'
          example: 10
        onboardingScore:
          type: integer
          description: 'The Client Onboarding score indicates the experience of a client device while connecting to    the
            network.

            If a client connects to the network successfully, the score is 4. If a client failed to connect to the network,
            the score is 1. If a client is idle, the score is 0.

            The Client Onboarding score is calculated as follows:

            `Wired Client`: Link to the first switch is up, authentication and  authorization is successful, and IP address
            is received.

            `Wireless Client`: Client Onboarding score range is from 1 to 4. When the client    connects to the network successfully,
            the score is 4. If the client failed to connect to the network, the score is 1.'
          example: 4
        connectedScore:
          type: integer
          description: "The Client Connectivity score indicates the experience of the client device after the     device is\
            \ connected to the network. The score is calculated as follows:\n`Wired Client`: Connectivity score can be 2 or\
            \ 6. Link errors determine the Connectivity     score and the resulting Overall Health score, as shown below:\n\
            \n  If a client onboards successfully but has link errors, the Connectivity score is 2 and     the Overall Health\
            \ score is 6.\n\n  If the client onboards successfully and there are no link errors between the client and   \
            \  the first-hop switch, the Connectivity score is 6 and the Overall Health score is 10.\n\n`Wireless Client`:\
            \ Connectivity score can be 0, 4, or 10. The RSSI and SNR range determines    the Connectivity score and the resulting\
            \ Overall Health score is calculated as the     weighted average of the RSSI-driven Connectivity score and the\
            \ SNR-driven Connectivity    score."
          example: 6
    WiredHealthKpi:
      type: object
      properties:
        linkErrorPercentageThreshold:
          type: number
          description: Threshold value in percentage for link error KPI used when calculating Wired Client connectivity score.
          example: 1
        isLinkErrorIncluded:
          type: boolean
          description: Is the link error KPI included in calculating the Wired Client connectivity health score.
          example: true
        discardsThreshold:
          type: number
          description: Threshold value in percentage for Discards KPI used when calculating Wired Client connectivity score.
          example: 1
        isDiscardsIncluded:
          type: boolean
          description: Is the Discards KPI included in calculating the Wired Client connectivity health score.
          example: true
        utilizationThreshold:
          type: number
          description: Threshold value in percentage for Utilization KPI used when calculating Wired Client connectivity score.
          example: 1
        isUtilizationIncluded:
          type: boolean
          description: Is the Utilization KPI included in calculating the Wired Client connectivity health score.
          example: true
    WirelessHealthKpi:
      type: object
      properties:
        rssiThreshold:
          type: integer
          description: Threshold value in dBm for RSSI KPI used when calculating Wireless Client connectivity score.
          example: -72
        snrThreshold:
          type: integer
          description: Threshold value in dB for SNR KPI used when calculating Wireless Client connectivity score.
          example: 9
        dataRateThreshold:
          type: integer
          description: Threshold value in Mbps for Data Rate KPI used when calculating Wireless Client connectivity score.
          example: 450
        retriesThreshold:
          type: integer
          description: Threshold value in percentage for Retries KPI used when calculating Wireless Client connectivity score.
          example: 5
        isRssiIncluded:
          type: boolean
          description: Is the RSSI KPI included in calculating the Wireless Client connectivity health score.
          example: true
        isSnrIncluded:
          type: boolean
          description: Is the SNR KPI included in calculating the Wireless Client connectivity health score.
          example: true
        isDataRateIncluded:
          type: boolean
          description: Is the Data Rate KPI included in calculating the Wireless Client connectivity health score.
          example: true
        isRetriesIncluded:
          type: boolean
          description: Is the Retries KPI included in calculating the Wireless Client connectivity health score.
          example: true
    CommonConnectedNetworkDeviceDetail:
      type: object
      properties:
        connectedNetworkDeviceId:
          $ref: '#/components/schemas/connectedDeviceId'
        connectedNetworkDeviceName:
          $ref: '#/components/schemas/connectedDeviceName'
        connectedNetworkDeviceManagementIp:
          type: string
          description: Management IP address of the network device where the client is connected
          example: 3.3.3.3
        connectedNetworkDeviceMac:
          type: string
          description: Mac address of the network device where the client is connected
          example: FF:DD:EE:CC:BB:AA
        connectedNetworkDeviceType:
          type: string
          description: The type of the connected device the client is connected to
          enum:
          - Access Point
          - Switch
      description: Connected network device attributes common for wired and wireless clients
    WiredConnectedNetworkDeviceDetail:
      type: object
      properties:
        interfaceName:
          $ref: '#/components/schemas/connectedInterfaceName'
        interfaceSpeed:
          type: integer
          description: Port speed in bits per second on the connected device where the wired client is connected
          format: int64
          example: 100000000
        duplexMode:
          type: string
          description: Duplex mode of the interface on the connected device where the wired client is connected
          enum:
          - Half Duplex
          - Full Duplex
      description: Connected network device attributes specific for wired clients
    CommonConnectionDetail:
      type: object
      properties:
        vlanId:
          $ref: '#/components/schemas/vlanId'
        sessionDuration:
          type: integer
          description: The amount of time in milliseconds the client was connected to network
          format: int64
          example: 12345678
      description: Client Connection attributes common for wired and wireless clients
    WiredConnectionDetail:
      type: object
      properties:
        vnId:
          $ref: '#/components/schemas/vnId'
        l2Vn:
          $ref: '#/components/schemas/L2Vn'
        l3Vn:
          $ref: '#/components/schemas/L3Vn'
        securityGroupTag:
          type: string
          description: Each security group in a Cisco TrustSec domain is assigned a unique 16 bit tag called the Security
            Group Tag (SGT). The SGT is a single label indicating the privileges of the source within the entire network.
            It is in turn  between network hops allowing any intermediary devices (switches, routers) to enforce polices based
            on the identity tag
          example: '133'
        linkSpeed:
          type: integer
          description: The negotiated speed in bits per second of the link between Wired client and connected network device
          format: int64
          example: 1000000000
        bridgeVMMode:
          type: string
          description: Is Bridge VM Mode supported by the client
      description: Connection attributes specific for wired clients
    WirelessConnectionDetail:
      type: object
      properties:
        band:
          type: string
          description: WiFi frequency band that client or Access Point operates. Band value is represented in Giga Hertz -
            GHz
          example: 5GHZ
          enum:
          - 2.4GHZ
          - 5GHZ
          - 6GHZ
        ssid:
          $ref: '#/components/schemas/Ssid'
        authType:
          type: string
          description: Authenciation type used by wireless client to connect to Access Point
          example: WPA2+802.1x/CCKM
        wlcName:
          $ref: '#/components/schemas/WlcName'
        wlcId:
          $ref: '#/components/schemas/WlcId'
        apMac:
          $ref: '#/components/schemas/ApMac'
        apEthernetMac:
          $ref: '#/components/schemas/ApEthernetMac'
        apMode:
          $ref: '#/components/schemas/ApMode'
        radioId:
          $ref: '#/components/schemas/RadioId'
        channel:
          $ref: '#/components/schemas/Channel'
        channelWidth:
          $ref: '#/components/schemas/ChannelWidth'
        protocol:
          $ref: '#/components/schemas/Protocol'
        protocolCapability:
          $ref: '#/components/schemas/ProtocolCapability'
        upnId:
          type: string
          description: User Private Network Id
        upnName:
          type: string
          description: User Private Network Name
        upnOwner:
          type: string
          description: User Private Network Owner
        upnDuid:
          type: string
          description: User Private Network Duid
        rssi:
          type: integer
          description: Received Signal Strength Indicator (RSSI) is   the measure of how well the wireless client can hear
            the   signal from Access Point. Measurement in dBm
          example: -52
        snr:
          type: integer
          description: Signal-to-Noise ratio (SNR) is the powerratio   between signal strength and noise level.Measurement
            in   decibels (dB).
          example: 41
        dataRate:
          type: integer
          description: Speed at which the data is transmitted by the Wireless client. This is the theoritical maximum speed
            the client can send the data. Measurement in bits per second (bps)
          format: int64
          example: 865
        isIosAnalyticsCapable:
          type: boolean
          description: Is the wireless client capabale of sending additional KPIs to wireless controller for in depth monitoring
          example: true
        isFabricClient:
          type: boolean
          description: Is the Client connected to a fabric network
          example: false
      description: Connection attributes specific for wireless clients
    CommonTrafficStats:
      type: object
      properties:
        txBytes:
          type: integer
          description: Amount of data sent by the client measured in bytes.
          format: int64
          example: 406695572
        rxBytes:
          type: integer
          description: Amount of data received by the client measured in bytes.
          format: int64
          example: 2753889933
        usage:
          type: integer
          description: Amount of data send and received by the client measured in bytes.
          format: int64
          example: 3160585505
        rxPackets:
          type: integer
          description: Number of packets received by the Client
          format: int64
          example: 3163
        txPackets:
          type: integer
          description: Number of packets sent by the Client
          format: int64
          example: 5647
        rxRate:
          type: number
          description: Number of bytes per second traffic received by the Client
          example: 1951.56
        txRate:
          type: number
          description: Number of bytes per second traffic sent by the Client
          example: 60182
      description: Traffic statistics common for wired and wireless clients
    WiredTrafficStats:
      type: object
      properties:
        rxLinkErrorPercentage:
          type: number
          description: Percentage of packets received by wired client that have errors (%)
          example: 0.5
        txLinkErrorPercentage:
          type: number
          description: Percentage of packets sent by wired client that have errors (%)
          example: 0.5
        inDiscards:
          type: number
          description: Percentage of incoming traffic discarded by wired client
          example: 20
        outDiscards:
          type: number
          description: Percentage of outgoing traffic discarded by wired client
          example: 20
        inUtilization:
          type: number
          description: Percentage of incoming interface bandwidth utilization
          example: 20
        outUtilization:
          type: number
          description: Percentage of outgoing interface bandwidth utilization
          example: 20
      description: Traffic statistics specific for wired client
    WirelessTrafficStats:
      type: object
      properties:
        rxRetries:
          type: integer
          description: Number of packets retransmitted by Access Point to Wireless client
          format: int64
          example: 1652
        rxRetryPercentage:
          type: number
          description: Percentage of packets retransmitted by Access Point to wireless client (%)
          example: 2.5
        txDrops:
          type: integer
          description: Number of packets that are dropped by wireless client before sending to Access Point
          format: int64
          example: 100
        txDropPercentage:
          type: number
          description: Percentage of packets that are dropped by wireless client before sending to Access Point (%)
          example: 1
        dnsRequestCount:
          type: integer
          description: The number of DNS requests sent by the client
          example: 112
        dnsResponseCount:
          type: integer
          description: The number of DNS responses received by the client
          example: 112
      description: Traffic statistics specific for wireless client
    OnboardingDetail:
      type: object
      properties:
        avgRunDuration:
          type: integer
          description: Average duration value taken by wireless client to move to 'RUN' state for all onboarding attempts.
            It is measured in milliseconds (ms)
          example: 1500
        maxRunDuration:
          type: integer
          description: Maximum duration value taken by wireless client to move to 'RUN' state for all onboarding attempts.
            It is measured in milliseconds (ms)
          example: 4500
        avgAssocDuration:
          type: integer
          description: Average duration value taken by wireless client to move to 'ASSOC' state for all onboarding attempts.
            It is measured in milliseconds (ms)
          example: 100
        maxAssocDuration:
          type: integer
          description: Maximum duration value taken by wireless client to move to 'ASSOC' state for all onboarding attempts.
            It is measured in milliseconds (ms)
          example: 500
        avgAuthDuration:
          type: integer
          description: Average duration value taken by wireless client to move to 'AUTH' state for all onboarding attempts.
            It is measured in milliseconds (ms)
          example: 50
        maxAuthDuration:
          type: integer
          description: Maximum duration value taken by wireless client to move to 'AUTH' state for all onboarding attempts.
            It is measured in milliseconds (ms)
          example: 200
        avgDhcpDuration:
          type: integer
          description: Average duration value taken by wireless client to move to 'DHCP' state for all onboarding attempts.
            It is measured in milliseconds (ms)
          example: 250
        maxDhcpDuration:
          type: integer
          description: Maximum duration value taken by wireless client to move to 'DHCP' state for all onboarding attempts.
            It is measured in milliseconds (ms)
          example: 750
        maxRoamingDuration:
          type: integer
          description: Maximum duration value taken by wireless client to move to finish Romaing state for all onboarding
            attempts. It is measured in milliseconds (ms)
          example: 750
        aaaServerIp:
          type: string
          description: AAA server IP address used by wireless client to verify if the client has permission to onboard the
            network
          example: 192.168.4.5
        dhcpServerIp:
          type: string
          description: DHCP server IP address used by wireless client to get the network details to help client connect to
            network
          example: 172.68.2.3
        onboardingTime:
          type: integer
          description: Time at which wireless client started onboarding process to connect to network.  It is specified in
            UNIX epochtime in milliseconds.  If wireless client goes through multiple onboarding attempts this field will
            be the first Onboarding attempt timestamp.
          format: int64
          example: 1707237517322
        authDoneTime:
          type: integer
          description: Time at which wireless client finished Authentication phase of onboarding to network. It is specified
            in UNIX epochtime in milliseconds. If wireless client goes through multiple onboarding attempts this field will
            be the latest Autentication attempt timestamp.
          format: int64
          example: 1707237517322
        assocDoneTime:
          type: integer
          description: Time at which wireless client finished Association phase of onboarding to network. It is specified
            in UNIX epochtime in milliseconds. If wireless client goes through multiple onboarding attempts this field will
            be the latest Association attempt timestamp.
          format: int64
          example: 1707237517322
        dhcpDoneTime:
          type: integer
          description: Time at which wireless client finished DHCP (accquiring network details) phase of onboarding to network.
            It is specified in UNIX epochtime in milliseconds. If wireless client goes through multiple onboarding attempts
            this field will be the latest DHCP attempt timestamp.
          format: int64
          example: 1707237517322
        roamingTime:
          type: integer
          description: Time at which wireless client finished Roaming phase of onboarding to network. It is specified in UNIX
            epochtime in milliseconds. If wireless client goes through multiple onboarding attempts this field will be the
            latest ROAM attempt timestamp.
          format: int64
          example: 1707237517322
        failedRoamingCount:
          type: integer
          description: Number of Roaming attempts failed by wireless client
          example: 2
        successfulRoamingCount:
          type: integer
          description: Number of Roaming attempts successful by wireless client
          example: 3
        totalRoamingAttempts:
          type: integer
          description: Number of Roaming attempts successful and failed by wireless client
          example: 5
        assocFailureReason:
          type: string
          description: Latest Association failure reason.
          example: cl_POOR_CHANNEL_CONDITIONS
        aaaFailureReason:
          type: string
          description: Latest AAA Server related Authentication failure reason.
          example: AUTH_AAA_NO_RESPONSE
        dhcpFailureReason:
          type: string
          description: Latest DHCP Server related IP Association failure reason.
          example: cl_REASON_DHCP_FAIL_LEASE_EXPIRED
        otherFailureReason:
          type: string
          description: Latest any other failure reason.
          example: Client Connect Timeout
        latestFailureReason:
          type: string
          description: Latest failure reason.
          example: aaaRootCause
        assocFailureReasonDescription:
          type: string
          description: Latest Association failure reason description.
          example: Poor Channel Conditions
        aaaFailureReasonDescription:
          type: string
          description: Latest AAA Server related Authentication failure reason description.
          example: No Response from AAA Server
        dhcpFailureReasonDescription:
          type: string
          description: Latest DHCP Server related IP Association failure reason description.
          example: DHCP Renew Failure - No Response upon Request
