          $ref: '#/components/schemas/ClientAttributes'
        filters:
          $ref: '#/components/schemas/ClientFilters'
        aggregateAttributes:
          $ref: '#/components/schemas/ClientAggregateAttributes'
        page:
          $ref: '#/components/schemas/PaginationWithAggregate'
      description: "Request payload used for summary query API. It contains \n"
    ClientsSummaryGroupsResponse:
      type: object
      properties:
        attributes:
          $ref: '#/components/schemas/AnalyticsAttributesResponse'
        aggregateAttributes:
          $ref: '#/components/schemas/ClientAggregateAttributesResponse'
        groups:
          type: array
          description: 'Additional groups and respective attributes under the group.

            The attributes comprising of each group are added to attributes list.

            '
          items:
            $ref: '#/components/schemas/ClientsGroupResponse'
      description: "Clients Summary response contains attributes, aggregateAttributes and groups\nattributes, aggregatedAttributes\
        \ and groups are mutually exclusive.\nIf user requests for summary without groupBy attributes then response includes\
        \ attributes, aggregateAttributes\nIf user requests for summary with groupBy attributes then response then includes\
        \ groups array contain attributes, aggregatedAttributes for each array element \n"
    ClientsSummaryResponse:
      type: object
      properties:
        response:
          $ref: '#/components/schemas/ClientsSummaryGroupsResponse'
        page:
          $ref: '#/components/schemas/PaginationWithAggregate'
        version:
          type: string
          description: The version of the response
          example: '1.0'
    ClientsTopNRequest:
      required:
      - groupBy
      - topN
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/startTime'
        endTime:
          $ref: '#/components/schemas/endTime'
        topN:
          $ref: '#/components/schemas/topN'
        groupBy:
          $ref: '#/components/schemas/ClientGroupByAttributes'
        attributes:
          $ref: '#/components/schemas/ClientAttributes'
        filters:
          $ref: '#/components/schemas/ClientFilters'
        aggregateAttributes:
          $ref: '#/components/schemas/ClientAggregateAttributes'
        page:
          $ref: '#/components/schemas/PaginationWithAggregate'
      description: 'Request payload used for Top-N query API. It contains

        '
    ClientsGroupResponse:
      type: object
      properties:
        id:
          type: string
          description: This is the group key. Unique value to identify the group. It is concatination of groupBy attributes
        attributes:
          $ref: '#/components/schemas/AnalyticsAttributesResponse'
        aggregateAttributes:
          $ref: '#/components/schemas/ClientAggregateAttributesResponse'
    ClientsTopNResponse:
      type: object
      properties:
        response:
          type: array
          description: Successfully return list of Clients TopN Analytics data
          items:
            $ref: '#/components/schemas/ClientsGroupResponse'
        page:
          $ref: '#/components/schemas/PaginationWithAggregate'
        version:
          type: string
          description: The version of the response
          example: '1.0'
    ErrorResponse:
      title: Error Response
      type: object
      properties:
        response:
          type: array
          description: The error response object
          items:
            $ref: '#/components/schemas/ErrorObject'
        version:
          type: string
          description: The version of the response
          example: '1.0'
      description: Contains information explaining the error that occured   processing this request.
      example:
        response:
        - errorCode: 2600
          message: Error message
          detail: Error details
      externalDocs:
        description: Error Codes - Cisco DevNet
        url: https://developer.cisco.com/docs/dna-center/#!api-quick-start/error-codes
    ErrorObject:
      type: object
      properties:
        errorCode:
          type: integer
          description: Application specific error code returned by the server
        message:
          type: string
          description: Brief message about the error condition
        detail:
          type: string
          description: A more detailed explanation of the error condition the   parameter and its value, that caused the condition
            and why it caused it.
      description: Error object containing error code and information about the error
    CountIntegerResponse:
      title: Count Integer Response
      type: object
      properties:
        response:
          $ref: '#/components/schemas/CountIntegerResponse_response'
        version:
          type: string
          description: The version of the response
          example: '1.0'
      description: Reports
    Function:
      type: string
      description: Type of aggregate function to apply on the field when querying   data
      example: sum
      enum:
      - sum
      - min
      - max
      - avg
      - count
      - latest
      - distinctCount
      - median
    Operator:
      type: string
      description: Type of filter operator to use for querying data | in and out operator takes multiple values and applies
        the filters
      enum:
      - in
      - neq
      - lt
      - gt
      - lte
      - gte
      - eq
      - notIn
      - like
    LogicalOperator:
      type: string
      description: 'Operator to use when attempting to apply a logical conjunction of more   than 1 filter


        Logical operations include: ''and'', ''or''.

        '
      enum:
      - and
      - or
    startTime:
      type: integer
      description: Start time from which the API queries the dataset related to the resource. It must be specified in terms
        of milliseconds since UNIX epoch. Value is inclusive.
      format: int64
      example: 1705348800000
    endTime:
      type: integer
      description: End time to which the API queries the dataset related to the resource. It must be specified in terms of
        milliseconds since UNIX epoch. Value is inclusive.
      format: int64
      example: 1705435200000
    trendInterval:
      type: string
      description: "The time window to aggregate the metrics. \nInterval can be 5 minutes or 10 minutes or 1 hour or 1 day\
        \ or 7 days\n"
      example: 5MIN
      default: 5MIN
      enum:
      - 5MIN
      - 10MIN
      - 1HR
      - 1DAY
      - 7DAY
    name:
      type: string
      description: Host name of the network entity such as Client or Network   Device
    IPv4Address:
      title: IPv4 Address
      type: string
      format: ipv4
      example: 250.162.252.170
    IPv6Address:
      title: IPv6 Address
      type: string
      format: ipv6
      example: 2001:db8:3c4d:15::1a2f:1a2b
    connectedDeviceId:
      type: string
      description: UUID of the neighbor network device that client or network   device is connected to
      format: uuid
      example: 0f538975-3085-40f2-9d25-7ad0047eeda5
    connectedDeviceName:
      type: string
      description: Name of the neighbor network device that client or network   device is connected to
      example: Local-Switch
    connectedInterfaceName:
      type: string
      description: Neighbor network device interface where wired client or network   device is connected to
      example: GigabitEthernet2/1/3
    vlanId:
      type: string
      description: VLAN identifier assigned to wired or wireless client
      example: '596'
    vnId:
      type: string
      description: Virtual network identifier assigned to wired client
      example: '8999'
    topN:
      maximum: 100
      minimum: 5
      type: integer
      description: Number of records to retrieve
      default: 5
      enum:
      - 5
      - 10
      - 50
      - 100
    CountIntegerResponse_response:
      type: object
      properties:
        count:
          type: integer
          description: The total number of records related to the resource
          format: int64
          example: 1000
