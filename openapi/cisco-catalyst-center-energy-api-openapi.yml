        \ based on the filters provided in the request body.\n\n  This API is asynchronous, which means there are two main\
        \ steps using it, one to generate the request task ID, and another to get the response data. This process is as follows.\n\
        \n  1. Make request to API to generate intended sites energy data. The response will be a 202 HTTP code with information\
        \ regarding the generated taskId for this submitted request and the URL to poll the status of this task (e.g., */dna/data/api/v1/assuranceTasks/bcbb2a8c-deae-4a3e-9459-0eb1dc12c191*).\n\
        \  \n  2. Once the status is completed, the response data will be retrievable using the method GET of the same sites\
        \ energy API endpoint by providing the query parameter `taskId` (e.g., */dna/data/api/v1/energy/sites/query?taskId=bcbb2a8c-deae-4a3e-9459-0eb1dc12c191*).\
        \ When a *taskId* is provided, all others query parameters are ignored.\n\n**The input payload contains the following\
        \ fields**\n|Field Name | Description |\n| --- | --- |\n| `startTime` | Start time from which API queries the data\
        \ set related to the resource. It must be specified in UNIX epochtime in milliseconds. Value is inclusive. If `startTime`\
        \ is not provided, API will default to one day before `endTime`. |\n| `endTime` | End time to which API queries the\
        \ data set related to the resource. It must be specified in UNIX epochtime in milliseconds. Value is inclusive. If\
        \ `endTime` is not provided, API will default to one day after `startTime`. If `startTime` is not provided either,\
        \ API will default to current time. |\n| `views` | An optional field, similar to attributes, is useful when a large\
        \ number of fields are required in the response data. The supported logical views and their respective fields are\
        \ available in. Not specifying an option for \"view\" will return both energy and site fields. |\n| `attributes` |\
        \ An optional filed that is used to get certain attributes in the response. The supported attributes are listed in\
        \ `siteEnergyAttributes` model. Note: When view and attributes have different variants, the attributes returned in\
        \ the response will be the union of both sets.\n| `filters` | Used to define one or more conditions. Only the devices\
        \ that satisfy these conditions will be taken into consideration during the aggregation calculation. This field can\
        \ be empty. The supported list of fiters are: **\"id\" - [eq, in], \"siteName\" - [eq, in, like], \"siteType\" - [eq,\
        \ in], \"siteHierarchy\"-[eq, in, like], \"siteHierarchyId\" - [eq, in, like], and \"deviceCategory\" - [eq, in]**.\
        \ Note that the \"devicecategory\" filter specifies which devices will be included when calculating energy consumption\
        \ values, rather than specifying the list of returned sites.\n| `aggregateAttributes` | Specifies the name of the\
        \ attribute on which the aggregate function should be applied when querying the data. The supported attribute names\
        \ are listed in `SiteEnergyAggregateAttribute` model. |\n|`page`| contains **limit, offset and sortBy** fields. *limit*\
        \ - Number of records to fetch in a page, *offset* - starting offset of data and *sortBy* - attribute name, order\
        \ and function if you want to sort by the aggregated field. *sortBy* field is a list, but only single field sorting\
        \ is supported on this API.|\n\n **How the filtering behavior works**\n\n\nThe filters field in each post body can\
        \ be used in numerous ways:\n\nEach filter in the list of filters will applied ''together''.\n\nIn the example below,\
        \ we would be filtering the sites to only include all the sites under \"/5b455edc-7c4e-4763-9bb3-5e826e20200f\". \n\
        ```\n\"filters\": [\n  {\n    key: \"siteHierarchyId\",\n    operator: \"like\",\n    value: \"/5b455edc-7c4e-4763-9bb3-5e826e20200f.*\"\
        \n  }\n]\n```\n\nEach filter object can contrastingly utilize its `logical operator` to provide nested filtering functionality.\n\
        Please refer to the 'API Support Documentation' section to understand which fields and filters are supported.\n\n\
        **How Pagination Works**\n\n'limit' field, is the total number of records you want to retrieve.\n\n'offset' field,\
        \ is the record you want to start on.\n\nIf you have a limit of 100, each page would be viewed as 100 elements. So\
        \ starting with an offset of 1, means look at the first page (starting from first record). To get the second page,\
        \ you need to specify offset 101 (starting with the 101st element). \n\n'sortBy' field is a list, but only single\
        \ field sorting is supported on this API.\n\nwith 'asc' (ascending), or 'desc' (descending) ordering\n\n**Below is\
        \ the sample example of the request payload.**\n```\n  {\n    \"startTime\": 1706590800000,\n    \"endTime\": 1707496410913,\n\
        \    \"filters\": [\n        {\n            \"key\": \"siteHierarchyId\",\n            \"operator\": \"like\",\n \
        \           \"value\": \"/8df02c92-755e-4583-8c19-fb62ea75daf9/416e8ba7-87d6-43c4-943a-d33dd3a93236/006be1b2-ffea-4a0c-9783-1a845ccddfec*\"\
        \n        }\n    ],\n    \"aggregateAttributes\": [\n        {\n            \"name\": \"deviceCount\",\n         \
        \   \"function\": \"distinctCount\"\n        },\n        {\n            \"name\": \"energyConsumed\",\n          \
        \  \"function\": \"sum\"\n        }\n    ],\n    \"page\": {\n        \"limit\": 100,\n        \"offset\": 1\n   \
        \ }\n  }\n  \n```\n"
      operationId: querySitesEnergy
      parameters:
      - name: X-CALLER-ID
        in: header
