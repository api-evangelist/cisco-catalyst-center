  /data/api/v1/energy/summaryAnalytics:
    post:
      tags:
      - energy
      summary: Get energy summary analytics
      description: "Retrieve the summary analytics data related to device energy consumption for all devices, including network\
        \ devices and clients assigned to specific sites. Utilize advanced filters to query a specific subset of energy information.\n\
        \n**The input payload contains the following fields**\n|Field Name | Description |\n| --- | --- |\n| `startTime` |\
        \ Start time from which API queries the data set related to the resource. It must be specified in UNIX epochtime in\
        \ milliseconds. Value is inclusive. If `startTime` is not provided, API will default to one day before `endTime`.\
        \ |\n| `endTime` | End time to which API queries the data set related to the resource. It must be specified in UNIX\
        \ epochtime in milliseconds. Value is inclusive. If `endTime` is not provided, API will default to one day after `startTime`.\
        \ If `startTime` is not provided either, API will default to current time. |\n| `filters` | Used to define one or\
        \ more filter conditions. Only devices that satisfy these conditions will be taken into consideration during the aggregation\
        \ calculation. This field can be empty. The supported list of filter keys and operators are: **\"id\", \"deviceName\"\
        , \"deviceCategory\", \"deviceSubCategory\", siteId\", \"siteHierarchy\", \"siteHierarchyId\"**. |\n| `groupBy` |\
        \ Specifies the attributes for grouping the data. The supported attributes are speficied in `DeviceEnergyGroupBy`\
        \ model. As of now, Group by supports the following combinations of attributes:  **[\"deviceCategory\"], [\"deviceSubCategory\"\
        ], and [\"deviceCategory\", \"deviceSubCategory\"]**. |\n| `attributes` | The attribute is useful for obtaining one\
        \ or more field data in addition to the aggregated data within the specified start and end time range. The supported\
        \ attributes are listed in ` DeviceEnergyAttribute` model|\n| `aggregateAttributes` | Specifies the name of the attribute\
        \ on which the aggregate function should be applied when querying the data. The supported attribute names are listed\
        \ in `DevicesEnergyAggregateAttribute` model.  |\n|`page`| Contains **limit, offset and sortBy** fields. *limit* -\
        \ Number of records to fetch in a page, *offset* - starting offset of data and *sortBy* - attribute name, order and\
        \ function if you want to sort by the aggregated field. *sortBy* field is a list, but only single field sorting is\
        \ supported on this API.|\nNotes:\n  * If \"groupby.attributes\" is left empty or set to default, the result will\
        \ be an aggregation of all filtered data.\n  * If no \"aggregateattributes\" are specified, the default attributes\
        \ and functions appliedare \"avg\" for carbonIntensity and \"sum\" for \"energyConsumed\", \"estimatedCost\", and\
        \ \"estimatedEmission\".\n\n**How the filtering behavior works**\n\nThe filters field in each post body can be used\
        \ in numerous ways:\n\nEach filter in the list of filters will applied ''together''\n\nIn the example below, this\
        \ would request filtering data from devices belonging to the ''Switch'' family `and` have series equal to ''cat9300''\
        \ or ''cat9400'.\n```\n\"filters\": [\n    {\n      \"key\": \"deviceCategory\",\n      \"operator\": \"eq\",\n  \
        \    \"value\": \"Switch\"\n    },\n    {\n      \"key\": \"deviceSubCategory\",\n      \"operator\": \"in\",\n  \
        \    \"value\": [\n        \"cat9300\",\n        \"cat9400\"\n      ]\n    }\n]\n```\n\nEach filter object can contrastingly\
        \ utilize its `logical operator` to provide nested filtering functionality.\n\nIn the example below you can see a\
        \ logical \"OR\" filter being applied using the nested filtering functionality:\n\nThe primary filter object does\
        \ not have its 'key', 'value', or 'operator' fields populated. Only the 'logicalOperator' field is populated, to indicate\
        \ the filters within the nested filters list are to be logically conjoined.\n\n```\n\"filters\": [\n    {\n      \"\
        logicalOperator\": \"or\",\n      \"filters\": [\n        {\n          \"key\": \"deviceCategory\",\n          \"\
        operator\": \"eq\",\n          \"value\": \"Switch\"\n        },\n        {\n          \"key\": \"deviceSubCategory\"\
        ,\n          \"operator\": \"in\",\n          \"value\": [\"cat9300\", \"cat9400\"]\n        }\n      ]\n    }\n]\n\
        ```\nPlease refer to the 'API Support Documentation' section to understand which fields and filters are supported.\n\
        \n**How Pagination Works**\n\n'limit' field, is the total number of records you want to retrieve.\n\n'offset' field,\
        \ is the record you want to start on.\n\nIf you have a limit of 100, each page would be viewed as 100 elements. So\
        \ starting with an offset of 1, means look at the first page (starting from first record). To get the second page,\
        \ you need to specify offset 101 (starting with the 101st element). \n\n'sortBy' field is a list, but only single\
        \ field sorting is supported on this API.\n\nwith 'asc' (ascending), or 'desc' (descending) ordering.\n\n\n      \n\
        \n\n```\n\n  \"page\": {\n    \"limit\": 5,\n    \"offset\": 1,\n    \"sortBy\": [\n      {\n        \"name\": \"\
        siteId\",\n        \"order\": \"desc\",\n        \"function\": \"max\"\n      }\n  ]\n  \n```\n\n**Example 1**:The\
        \ JSON input below represents a request body used to retrieve sum data of deviceCount, energyConsumed on one specific\
        \ site.\n  \n\n```\n  {\n    \"startTime\": 1706590800000,\n    \"endTime\": 1707496410913,\n    \"filters\": [\n\
        \        {\n            \"key\": \"siteHierarchyId\",\n            \"operator\": \"like\",\n            \"value\"\
        : \"/8df02c92-755e-4583-8c19-fb62ea75daf9/416e8ba7-87d6-43c4-943a-d33dd3a93236/006be1b2-ffea-4a0c-9783-1a845ccddfec*\"\
        \n        }\n    ],\n    \"aggregateAttributes\": [\n        {\n            \"name\": \"deviceCount\",\n         \
        \   \"function\": \"distinctCount\"\n        },\n        {\n            \"name\": \"energyConsumed\",\n          \
        \  \"function\": \"sum\"\n        }\n    ],\n    \"page\": {\n        \"limit\": 100,\n        \"offset\": 1\n   \
        \ }\n  }\n  \n```\n\n**Response**\n\n```\n {\n    \"response\": {\n        \"aggregateAttributes\": [\n          \
        \  {\n                \"name\": \"deviceCount\",\n                \"function\": \"distinctCount\",\n             \
        \   \"value\": 1\n            },\n            {\n                \"name\": \"energyConsumed\",\n                \"\
        function\": \"sum\",\n                \"value\": 108457.0\n            }\n        ]\n    },\n    \"page\": {\n   \
        \     \"limit\": 100,\n        \"offset\": 1,\n        \"count\": 1,\n        \"sortBy\": null\n    },\n    \"version\"\
        : \"1.0\"\n} ```\n"
      operationId: queryDeviceEnergySummaryAnalytics
      parameters:
      - name: X-CALLER-ID
        in: header
        description: 'Caller ID is used to trace the origin of API calls and their associated queries executed on the database.
          It''s an optional header parameter that can be added to an API request.

          '
        required: false
        schema:
          type: string
          default: unknown
        example: intent
      requestBody:
        description: Payload to query summary analytics of device energy summaries
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEnergySummaryAnalyticsRequest'
            examples:
              GroupByRequestExample:
                $ref: '#/components/examples/SummaryAnalyticsWithGroupByRequestExample'
              WithoutGroupByRequestExample:
                $ref: '#/components/examples/SummaryAnalyticsWithoutGroupByRequestExample'
        required: true
      responses:
        '200':
          description: Devices Energy Summary Analytics Response model on success
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/DeviceEnergySummaryAnalyticsResponse'
              examples:
                WithGroupByResponseExample:
                  $ref: '#/components/examples/SummaryAnalyticsWithGroupByResponseExample'
                WithoutGroupByResponseExample:
                  $ref: '#/components/examples/SummaryAnalyticsWithoutGroupByResponseExample'
        '400':
          description: The client made a request that the server could not understand (for example, the request syntax is
            incorrect).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The server could not fulfill the request due to internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        1XX:
          description: Informational Responses - The server received the request and sent an informational response.
        2XX:
          description: Successful Responses - The server received the client request, understood it, and accepted it.
        3XX:
          description: Redirection Messages - The client must take additional action to complete the request.
        4XX:
          description: Client Error Responses - The client request caused the error.
        5XX:
          description: Server Error Responses - The server failed to fulfill the request.
        default:
          description: Unexpected Error
