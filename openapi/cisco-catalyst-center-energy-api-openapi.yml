  /data/api/v1/energy/trendAnalytics:
    post:
      tags:
      - energy
      summary: Get energy trend analytics
      description: "Retrieve the energy trend analytics data related to device energy consumption for all devices, including\
        \ network devices and clients assigned to specific sites. Utilize advanced filters to query a specific subset of energy\
        \ information.\n\n**The input payload contains the following fields:**\n|Field Name | Description |\n| --- | --- |\n\
        | `startTime` | Start time from which API queries the data set related to the resource. It must be specified in UNIX\
        \ epochtime in milliseconds. Value is inclusive. If `startTime` is not provided, API will default to one day before\
        \ `endTime`. |\n| `endTime` | End time to which API queries the data set related to the resource. It must be specified\
        \ in UNIX epochtime in milliseconds. Value is inclusive. If `endTime` is not provided, API will default to one day\
        \ after `startTime`. If `startTime` is not provided either, API will default to current time. |\n| `trendInterval`\
        \ |  Specifies the granularity on which data should be queried. Ex. If 1HR is specified than the data returned will\
        \ in 1 hour interval. By default, if no value is specified - for 24 hours or less, it would be 1HR interval and anything\
        \ more than 24 hours, the interval would be 1 day\n| `filters` | Used to define one or more filter conditions. Only\
        \ devices that satisfy these conditions will be taken into consideration during the aggregation calculation. This\
        \ field can be empty. The supported list of filter keys and operators are: **\"id\", \"deviceName\", \"deviceCategory\"\
        , \"deviceSubCategory\", siteId\", \"siteHierarchy\", \"siteHierarchyId\"**. |\n| `groupBy` | Specifies the attributes\
        \ for grouping the data. The supported attributes are speficied in `DeviceEnergyGroupBy` model. As of now, Group by\
        \ supports the following combinations of attributes:  **[\"deviceCategory\"], [\"deviceSubCategory\"], and [\"deviceCategory\"\
        , \"deviceSubCategory\"]**. |\n| `attributes` | The attribute is useful for obtaining one or more field data in addition\
        \ to the aggregated data within the specified start and end time range. The supported attributes are listed in ` DeviceEnergyAttribute`\
        \ model|\n| `aggregateAttributes` | Specifies the name of the attribute on which the aggregate function should be\
        \ applied when querying the data. The supported attribute names are listed in `DevicesEnergyAggregateAttribute` model.\
        \  |\n|`page`| Contains **limit, offset and sortBy** fields. *limit* - Number of records to fetch in a page, *offset*\
        \ - starting offset of data and *sortBy* - attribute name, order and function if you want to sort by the aggregated\
        \ field. *sortBy* field is a list, but only single field sorting is supported on this API.|\nNotes:\n  * If \"groupby.attributes\"\
        \ is left empty or set to default, the result will be an aggregation of all filtered data.\n  * If no \"aggregateattributes\"\
        \ are specified, the default attributes and functions appliedare \"avg\" for carbonIntensity and \"sum\" for \"energyConsumed\"\
        , \"estimatedCost\", and \"estimatedEmission\".\n\n**How the filtering behavior works**\n\nThe filters field in each\
        \ post body can be used in numerous ways:\n\nEach filter in the list of filters will applied ''together''\n\nIn the\
        \ example below, this would request filtering data from devices belonging to the ''Switch'' family `and` have series\
        \ equal to ''cat9300'' or ''cat9400'.\n```\n\"filters\": [\n    {\n      \"key\": \"deviceCategory\",\n      \"operator\"\
        : \"eq\",\n      \"value\": \"Switch\"\n    },\n    {\n      \"key\": \"deviceSubCategory\",\n      \"operator\":\
        \ \"in\",\n      \"value\": [\n        \"cat9300\",\n        \"cat9400\"\n      ]\n    }\n]\n```\n\nEach filter object\
        \ can contrastingly utilize its `logical operator` to provide nested filtering functionality.\n\nIn the example below\
        \ you can see a logical \"OR\" filter being applied using the nested filtering functionality:\n\nThe primary filter\
        \ object does not have its 'key', 'value', or 'operator' fields populated. Only the 'logicalOperator' field is populated,\
        \ to indicate the filters within the nested filters list are to be logically conjoined.\n\n```\n\"filters\": [\n \
        \   {\n      \"logicalOperator\": \"or\",\n      \"filters\": [\n        {\n          \"key\": \"deviceCategory\"\
        ,\n          \"operator\": \"eq\",\n          \"value\": \"Switch\"\n        },\n        {\n          \"key\": \"\
        deviceSubCategory\",\n          \"operator\": \"in\",\n          \"value\": [\"cat9300\", \"cat9400\"]\n        }\n\
        \      ]\n    }\n]\n```\nPlease refer to the 'API Support Documentation' section to understand which fields and filters\
        \ are supported.\n\n**How Pagination Works**\n\n'limit' field, is the total number of records you want to retrieve.\n\
        \n'offset' field, is the record you want to start on.\n'timestampOrder' is supported for trend analytics with 'asc'\
        \ (ascending), or 'desc' (descending) ordering\n\n\n**Example1** Request Body:\n\n```\n{\n    \"startTime\": 1710964767403,\n\
        \    \"endTime\": 1711051167403,\n    \"filters\": [\n        {\n            \"key\": \"siteHierarchyId\",\n     \
        \       \"value\": \"/8df02c92-755e-4583-8c19-fb62ea75daf9*\",\n            \"operator\": \"like\"\n        }\n  \
        \  ],\n    \"groupBy\": [],\n    \"aggregateAttributes\": [\n        {\n            \"name\": \"energyConsumed\",\n\
        \            \"function\": \n                \"sum\"\n        }\n    ]\n    ,\n    \"page\": {\n      \"limit\": 2,\n\
        \      \"offset\": 1,\n      \"timestampOrder\": \"desc\"\n    } \n}\n```\nResponse: \n```\n{\n    \"response\": [\n\
        \        {\n            \"time\": 1.7109648E+12,\n            \"aggregateAttributes\": [\n                {\n    \
        \                \"name\": \"energyConsumed\",\n                    \"function\": \"sum\",\n                    \"\
        value\": 1343.875\n                }\n            ]\n            \n        },\n        {\n            \"time\": 1.7109684E+12,\n\
        \            \"aggregateAttributes\": [\n                {\n                    \"name\": \"energyConsumed\",\n  \
        \                  \"function\": \"sum\",\n                    \"value\": 1033.25\n                }\n           \
        \ ]\n        }\n    ],\n    \"page\": {\n        \"limit\": 2,\n        \"offset\": 1,\n        \"count\": 24,\n \
        \       \"page\": {\n          \"limit\": 2,\n          \"offset\": 1,\n          \"timestampOrder\": \"desc\"\n \
        \       } \n    }},\n    \"version\": \"1.0\"\n}\n```\n"
      operationId: queryDeviceEnergyTrendAnalytics
