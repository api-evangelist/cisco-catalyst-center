  /data/api/v1/energy/networkDevices/query:
    post:
      tags:
      - energy
      summary: Query devices energy.
      description: "Retrieves a list of network devices along with their energy data for a specified time range, based on\
        \ the filters provided in the request body.\n\n**The input payload contains the following fields**\n|Field Name |\
        \ Description |\n| --- | --- |\n| `startTime` | Start time from which API queries the data set related to the resource.\
        \ It must be specified in UNIX epochtime in milliseconds. Value is inclusive. If `startTime` is not provided, API\
        \ will default to one day before `endTime`. |\n| `endTime` | End time to which API queries the data set related to\
        \ the resource. It must be specified in UNIX epochtime in milliseconds. Value is inclusive. If `endTime` is not provided,\
        \ API will default to one day after `startTime`. If `startTime` is not provided either, API will default to current\
        \ time. |\n| `attributes` | An optional filed that is used to get certain attributes in the response. The supported\
        \ attributes are listed in `networkDeviceEnergyAttributes` model. Note: When view and attributes have different variants,\
        \ the attributes returned in the response will be the union of both sets. |\n| `views` | An optional field, similar\
        \ to attributes, is useful when a large number of fields are required in the response data. The supported logical\
        \ views and their respective fields are available in `networkDeviceEnergyViews`.  |\n| `filters` | Used to define\
        \ one or more filter conditions. Only devices that satisfy these conditions will be taken into consideration during\
        \ the aggregation calculation. This field can be empty. The supported list of filter keys and operators are: **\"\
        id\" - [eq, in], \"deviceName\" - [eq, in, like], \"deviceCategory\" - [eq, in], \"deviceSubCategory\" - [eq, in],\
        \ \"siteId\" - [eq, in], \"siteHierarchy\"-[eq, in, like],  \"siteHierarchyId\" - [eq, in, like]**.\n| `aggregateAttributes`\
        \ | Specifies the name of the attribute on which the aggregate function should be applied when querying the data.\
        \ The supported attribute names are listed in `DevicesEnergyAggregateAttribute` model. |        \n|`page`| Contains\
        \ **limit, cursor and sortBy** fields. *limit* - Number of records to fetch in a page, *cursor* - string field indicating\
        \ the next record in the response list and *sortBy* - attribute name, order and function if you want to sort by the\
        \ aggregated field. *sortBy* field is a list, but only single field sorting is supported on this API.|\n\n**How the\
        \ filtering behavior works**\n\nThe filters field in each post body can be used in numerous ways:\n\nEach filter in\
        \ the list of filters will applied ''together''\n\nIn the example below, this would request filtering data from devices\
        \ belonging to the ''Switch'' family `and` have series equal to ''cat9300'' or ''cat9400'.\n```\n\"filters\": [\n\
        \    {\n      \"key\": \"deviceCategory\",\n      \"operator\": \"eq\",\n      \"value\": \"Switch\"\n    },\n   \
        \ {\n      \"key\": \"deviceSubCategory\",\n      \"operator\": \"in\",\n      \"value\": [\"cat9300\", \"cat9400\"\
        ]\n    }\n]\n```\n\nEach filter object can contrastingly utilize its `logical operator` to provide nested filtering\
        \ functionality.\n\nIn the example below you can see a logical \"OR\" filter being applied using the nested filtering\
        \ functionality:\n\nThe primary filter object does not have its 'key', 'value', or 'operator' fields populated. Only\
        \ the 'logicalOperator' field is populated, to indicate the filters within the nested filters list are to be logically\
        \ conjoined.\n\n```\n\"filters\": [\n    {\n      \"logicalOperator\": \"or\",\n      \"filters\": [\n        {\n\
        \          \"key\": \"deviceCategory\",\n          \"operator\": \"eq\",\n          \"value\": \"Switch\"\n      \
        \  },\n        {\n          \"key\": \"deviceSubCategory\",\n          \"operator\": \"in\",\n          \"value\"\
        : [\"cat9300\", \"cat9400\"]\n        }\n      ]\n    }\n]\n```\nPlease refer to the 'API Support Documentation' section\
        \ to understand which fields and filters are supported.\n\n**How Pagination Works**\n\n'limit' field, is the total\
        \ number of records you want to retrieve.\n\n'cursor' field, indicating the next record in the response list.\n\n\
        If you have a limit of 100, each page would be viewed as 100 elements. So starting with an empty cursor, means look\
        \ at the first page (starting from first record). To get the second page, you need to specify cursor returned in the\
        \ response of the first request.\n\n'sortBy' field is a list, but only single field sorting is supported on this API.\n\
        \nwith 'asc' (ascending), or 'desc' (descending) ordering\n\n**Example 1**\n\nRequest body\n\n```\n{\n    \"startTime\"\
        : 1703195600000,\n    \"endTime\": 1707800400000,\n    \"filters\": [\n        {\n            \"key\": \"id\",\n \
        \           \"operator\": \"in\",\n            \"value\": [\"f4b8bceb-588b-490c-b726-3dd8caf65071\"]\n        }\n\
        \    ],\n    \"views\": [\"device\"],\n    \"attributes\": [\"siteHierarchy\"],\n    \"page\": {\n        \"limit\"\
        : 100,\n        \"cursor\": \"\"\n    }\n}\n```\n\nResponse:\n\n``` {\n    \"response\": [\n            {\n      \
        \          \"id\": \"f4b8bceb-588b-490c-b726-3dd8caf65071\",\n                \"deviceName\": \"ott-sda-c9k-01.cisco.com\"\
        ,\n                \"deviceCategory\": \"Switch\",\n                \"deviceSubCategory\": \"Cisco Catalyst 9300 Switch\"\
        ,\n                \"siteHierarchy\": \"Global/Ottawa\"\n            }\n        ],\n        \"page\": {\n        \
        \    \"limit\": 100,\n            \"cursor\": \"abcd123\",\n            \"count\": 1,\n            \"sortBy\": null\n\
        \        },\n        \"version\": \"1.0\"\n    }\n```\n"
      operationId: queryNetworkDevicesEnergy
      parameters:
      - name: X-CALLER-ID
        in: header
        description: 'Caller ID is used to trace the origin of API calls and their associated queries executed on the database.
          It''s an optional header parameter that can be added to an API request.

          '
        required: false
        schema:
          type: string
          default: unknown
        example: intent
      requestBody:
        description: Payload to query device energy summaries
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkDeviceEnergyQueryRequest'
            examples:
              WithViewPassedQueryAPIRequestExample:
                $ref: '#/components/examples/QueryWithViewPassedRequestExample'
              WithoutViewPassedQueryAPIRequestExample:
                $ref: '#/components/examples/QueryWithoutViewPassedRequestExample'
        required: true
      responses:
        '200':
          description: Devices Energy Summaries Query Response model on success
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/NetworkDevicesEnergyQueryResponse'
              examples:
                WithViewPassedQueryResponseExample:
                  $ref: '#/components/examples/QueryWithViewPassedResponseExample'
                WithoutViewPassedQueryAPIResponseExample:
                  $ref: '#/components/examples/QueryWithoutViewPassedResponseExample'
        '400':
          description: The client made a request that the server could not understand (for example, the request syntax is
            incorrect).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The server could not fulfill the request due to internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        1XX:
          description: Informational Responses - The server received the request and sent an informational response.
        2XX:
          description: Successful Responses - The server received the client request, understood it, and accepted it.
        3XX:
