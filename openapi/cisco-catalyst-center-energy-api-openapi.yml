  /dna/data/api/v1/energy/sites:
    get:
      tags:
      - energy
      summary: Get sites energy
      description: "Retrieves a list of sites with energy data based on the specified query parameters. The response includes\
        \ the total energy data for the period between the provided start and end times. If the start and end times are not\
        \ specified, the data for the last 24 hours is returned.\n\n  This API is asynchronous, which means there are two\
        \ main steps using it, one to generate the request task ID, and another to get the response data. This process is\
        \ as follows.\n\n  1. Make request to API to generate intended sites energy data. The response will be a 202 HTTP\
        \ code with information regarding the generated taskId for this submitted request and the URL to poll the status of\
        \ this task (e.g., */dna/data/api/v1/assuranceTasks/bcbb2a8c-deae-4a3e-9459-0eb1dc12c191*).\n  \n  2. Once the status\
        \ is completed, the response data will be retrievable using the method GET of the same sites energy API endpoint by\
        \ providing the query parameter `taskId` (e.g., */dna/data/api/v1/energy/sites?taskId=bcbb2a8c-deae-4a3e-9459-0eb1dc12c191*).\
        \ When a *taskId* is provided, all others query parameters are ignored."
      operationId: readSitesEnergy
      parameters:
      - name: startTime
        in: query
        description: 'Start time from which API queries the data set related to the resource. It must be specified in UNIX
          epochtime in milliseconds. Value is inclusive.


          If `startTime` is not provided, API will default to one day before `endTime`.

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
        example: 1705348800000
      - name: endTime
        in: query
        description: 'End time to which API queries the data set related to the resource. It must be specified in UNIX epochtime
          in milliseconds. Value is inclusive.


          If `endTime` is not provided, API will default to one day after `startTime`. If `startTime` is not provided either,
          API will default to current time.

          '
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
        example: 1705435200000
      - name: limit
        in: query
        description: Maximum number of records to return
        schema:
          minimum: 1
          type: integer
          default: 500
      - name: offset
        in: query
        description: Specifies the starting point within all records returned by the API. It's one based offset. The starting
          value is 1.
        schema:
          minimum: 1
          type: integer
          default: 1
      - name: sortBy
        in: query
        description: A field within the response to sort by.
        schema:
          type: string
      - name: order
        in: query
        description: The sort order of the field ascending or descending.
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      - name: siteHierarchy
