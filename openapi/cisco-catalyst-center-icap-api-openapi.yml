    CaptureFileAnalysisResponseExample:
      summary: Capture file analysis response
      value:
        version: '1.0'
        response:
          metadata:
            pcapId: F0D8054CB360-360_80211_1781249943182823
            createdDate: 2026-06-12 07:39:13+00:00
            captureReason: AP_EVENT_STA_EAPOL_4WAY_TIMEOUT
            byteSize: 1624
            packetCount: 9
          title: DHCP timeout.
          summary: 'The client experienced a timeout during the authentication process despite having excellent signal strength and coverage conditions. The authentication frame required retransmission, indicating potential processing delays or intermittent communication issues at the AP level.


            ⚠️ **Authentication Retransmission**: The client had to retransmit its authentication frame, suggesting the initial attempt was not acknowledged by the AP


            ℹ️ **Strong Signal Quality**: Signal strength of -44 dBm with 39 dB SNR indicates excellent wireless coverage, ruling out RF-related connectivity issues


            ✅ **Successful Authentication Status**: The authentication frame itself contains a successful status code, indicating the authentication mechanism is functioning properly'
          highlights:
          - frameNumber: 7
            details:
            - type: eapol
              highlights:
              - 802.1X Authentication
            - type: wlan_rsna_eapol.keydes.msgnr
              highlights:
              - 'Message number: 1'
          reasoning:
            results: 'Client authentication retry with good signal strength, indicating potential password-related connectivity issue.


              --------------------------------------------------------------


              Frame 1: Authentication

              The client is retransmitting an authentication frame to the AP with good signal strength (-44 dBm) and signal-to-noise ratio (39 dB). The retry flag indicates this is not the first attempt, suggesting the initial authentication request may not have been acknowledged by the AP. While the frame shows a successful status code, the need for retransmission combined with the reported password issue suggests there may be authentication credential problems preventing successful connection establishment.'
            jsonResults: '{"frameExplanations":[{"firstFrame":1,"lastFrame":1,"frameType":"Authentication","explanation":"The client is retransmitting an authentication frame to the AP with good signal strength (-44 dBm) and signal-to-noise ratio (39 dB). The retry flag indicates this is not the first attempt, suggesting the initial authentication request may not have been acknowledged by the AP. While the frame shows a successful status code, the need for retransmission combined with the reported password issue suggests there may be authentication credential problems preventing successful connection establishment."}],"summary":"Client authentication retry with good signal strength, indicating potential password-related connectivity issue."}'
          flow:
          - frameNumber: 1
            timestamp: 0.0
            title: Authentication
            description: Management Frame => Dot11EltVendorSpecific
            direction: RX
            channelFrequency: 5300
            display: true
            group: 1
          suggestedActions:
            actions:
            - action: Verify the Pre-Shared Key (PSK) or client driver/firmware configuration on the client side is correct. '4-way handshake failed' usually means client failed to complete 4-way EAP Key exchange
              priority: medium
