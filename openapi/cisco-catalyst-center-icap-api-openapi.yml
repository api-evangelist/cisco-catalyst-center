    RadioStatsFilters:
      maxItems: 10
      type: array
      description: 'List of filters to apply when querying the data



        Filtering on numerical fields (integer, number,etc.) will support the

        numerical operators:



        [eq, lt, gt, lte, gte]



        Filtering on text fields (string), will support the string operators:



        [eq, in, notIn, like]



        For the list of supported fields, please refer to the RadioFilterField model

        model.

        '
      items:
        $ref: '#/components/schemas/RadioStatsFilterObj'
    ClientStatsRawDataQueryRequest:
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/startTime'
        endTime:
          $ref: '#/components/schemas/endTime'
        filters:
          $ref: '#/components/schemas/ClientStatsFilters'
        page:
          $ref: '#/components/schemas/PaginationTrendOffset'
      description: 'Request payload used for raw data query API. It contains |

        ''filters'' - To provide list of complex filters with combination of AND filters and OR filters to be applied on the API resource |

        '
    ClientStatsFilterObj:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/ClientStatsFilterField'
        operator:
          $ref: '#/components/schemas/StatsFilterOperator'
        logicalOperator:
          $ref: '#/components/schemas/LogicalOperator'
        value:
          type: object
          description: 'Field value(s) to filter the data set. Array of values is used for   "in" or "out" operator. Values will be of whatever type the   specific field being filtered is defined with.


            For other operators, filter value is of whatever type the specific   field being filtered is defined with.


            In the case of an "and" or "or" operator, this values array will be   ignored, and the values arrays in each of the *nested filters* will be used.

            The data type of a value, or each item inside the value in case it is a list, must match the type defined in the Client response model

            '
        filters:
          type: array
          description: 'Nested array of filters in case of AND/OR based filters. Only one   level of nesting will be supported.


            Structure of nested filter is the same as parent with all operators   supported except AND or OR.

            '
          items:
            $ref: '#/components/schemas/ClientStatsFilterObj'
    PaginationTrendOffset:
      type: object
      properties:
        limit:
          minimum: 1
          type: integer
          description: Number of records to fetch in a page
          example: 100
          default: 100
        offset:
          minimum: 1
          type: integer
          description: Starting offset of data to fetch and returned
          example: 5
          default: 1
        count:
          type: integer
          description: Number of records returned after applying applicable filtering. Field is ignored for request and updated by API in the response
          example: 100
        timeSortOrder:
