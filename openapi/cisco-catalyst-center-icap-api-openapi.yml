            * `title` - a short natural language title for the detected issue.

            * `summary` - a natural language summary of the pcap (a few sentences).

            * `reasoning` - a step-by-step analysis of what happened in the pcap.

            * `highlights` - a condensed list of the most relevant flow entries.

            * `flow` - the ordered packet flow entries returned by the analysis.

            * `suggestedActions` - the list of suggested actions that may be taken to diagnose or resolve the issue.

