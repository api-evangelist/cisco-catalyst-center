generated: '2026-08-19'
method: searched
status: published
source: https://github.com/cisco-en-programmability/catc-mcp-oss
deployment:
  mode: local-stdio
  install: git clone https://github.com/cisco-en-programmability/catc-mcp-oss && git checkout release/<M.N.P.Q> && docker
    build -t catalyst-center-mcp:local . && docker run --rm -p 127.0.0.1:7001:7001 catalyst-center-mcp:local
  package: https://github.com/cisco-en-programmability/catc-mcp-oss
  auth: none
  verified: searched
deployment_note: There is NO Cisco-hosted remote MCP endpoint. The operator builds the Docker image from a release branch
  matching their controller version and runs it themselves; it then serves a streamable-HTTP endpoint on http://localhost:7001/v1/mcp
  or speaks stdio as a client-launched child process. The MCP endpoint itself requires no inbound credential — the README
  states "The local server does not require an inbound header" — and the server authenticates upstream to Catalyst Center
  with CATALYST_CENTER_USERNAME / CATALYST_CENTER_PASSWORD environment variables. Cisco explicitly warns the server adds
  no authorization layer and does not enforce read-only access.
server:
  name: catalyst-center
  transport:
  - http
  - stdio
  local_endpoint: http://localhost:7001/v1/mcp
  health: http://localhost:7001/v1/health
  readiness: http://localhost:7001/v1/readiness
  license: Apache-2.0
  implementation: FastMCP (Python)
  release_branch: release/2.3.7.11
  bundle_version: 2.3.7.x
clients_documented:
- Claude Desktop
- Cursor
- VS Code
- Codex
agents:
- catalyst_client_troubleshooting_agent
- catalyst_flexible_reports_agent
- catalyst_network_engineer_agent
tool_count: 516
tool_methods:
  GET: 514
  POST: 1
  null: 1
